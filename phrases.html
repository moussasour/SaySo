<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-i18n="t_browse">تصفّح · SaySo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><link rel="manifest" href="manifest.json"><link rel="icon" href="assets/icon.svg"><meta name="theme-color" content="#0A6B54">
</head>
<body>
<main>
<h1>SaySo</h1>
<div class="bar-row"><input id="q" placeholder="ابحث بالعربية أو الإنجليزية… (اضغط /)" data-i18n-ph="ph_browse" autocomplete="off" aria-label="بحث" data-i18n-aria="search_aria"><button class="btn" id="rnd" data-i18n="rnd">عشوائية</button><label class="muted"><input type="checkbox" id="hide"> <span data-i18n="hide">إخفاء المحفوظة</span></label></div>
<div class="pills" id="pills"></div><div class="muted" id="cnt" aria-live="polite"></div><div class="grid2" id="list" style="margin-top:12px"></div>
<div class="center" style="margin-top:22px"><button class="btn" id="more" data-i18n="more">عرض المزيد</button></div>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script>
const {P,$,cats,icons}=App;const U=new URLSearchParams(location.search);let cat=cats.includes(U.get("c"))?U.get("c"):"الكل",n=24,res=[],t;$("#q").value=U.get("q")||"";
$("#pills").innerHTML=["الكل",...cats].map(c=>`<button data-c="${c}">${icons[c]||""} ${App.catName(c)}</button>`).join("");
function run(reset){if(reset)n=24;const q=$("#q").value.trim();res=App.search(q,cat);if($("#hide").checked)res=res.filter(p=>!App.isLearned(p.arabic));
document.querySelectorAll("#pills button").forEach(b=>b.classList.toggle("on",b.dataset.c===cat));
$("#cnt").textContent=App.t("results",res.length);$("#list").innerHTML=res.slice(0,n).map(p=>App.card(p,q)).join("")||"<p class=muted>"+App.t("no_results")+"</p>";$("#more").hidden=res.length<=n;
try{const s=new URLSearchParams();if(q)s.set("q",q);if(cat!=="الكل")s.set("c",cat);history.replaceState(null,"",s.toString()?"?"+s:location.pathname)}catch(e){}}
$("#q").oninput=()=>{clearTimeout(t);t=setTimeout(()=>run(1),200)};$("#hide").onchange=()=>run(1);$("#more").onclick=()=>{n+=24;run()};
$("#pills").onclick=e=>{const b=e.target.closest("button");if(b){cat=b.dataset.c;run(1)}};
$("#rnd").onclick=()=>{const l=App.search("",cat);const p=l[Math.floor(Math.random()*l.length)];$("#q").value="";$("#cnt").textContent=App.t("rnd_label");$("#list").innerHTML=App.card(p);$("#more").hidden=true};
document.addEventListener("app:change",()=>{if($("#cnt").textContent!==App.t("rnd_label"))run()});
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==$("#q")){e.preventDefault();$("#q").focus()}});run(1);
</script>
</body>
</html>
