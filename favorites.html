<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-i18n="t_saved">محفوظاتي · SaySo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><link rel="manifest" href="manifest.json"><link rel="icon" href="assets/icon.svg"><meta name="theme-color" content="#0A6B54">
</head>
<body>
<main>
<h1 data-i18n="h_saved">محفوظاتي</h1>
<div class="stats" id="chips"></div>
<div style="margin:22px 0 4px"><div class="bar"><div id="pf"></div></div><div class="muted" id="pt" style="margin-top:6px"></div></div>
<div class="tabs"><button class="btn on" data-t="fav" data-i18n="tab_fav">المفضلة</button><button class="btn" data-t="learned" data-i18n="tab_learned">المحفوظة</button><button class="btn" id="exp" data-i18n="export">تصدير JSON</button><button class="btn danger" id="rst" data-i18n="reset">تصفير التقدّم</button></div>
<div class="grid2" id="list"></div>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script>
const {P,$,st}=App;let tab="fav";
const items=()=>tab==="fav"?App.fav.map(f=>P.find(p=>p.arabic===f.arabic)).filter(Boolean):P.filter(p=>App.isLearned(p.arabic));
function render(){const L=App.learned.size,pc=Math.round(L/P.length*100);
$("#chips").innerHTML=[[App.fav.length,App.t("chip_fav")],[L,App.t("chip_learned")],[pc+"%",App.t("chip_prog")],[st.get("quiz-best",0)+"/10",App.t("chip_best")],[App.streak(),App.t("chip_streak")]].map(c=>`<div class="stat"><b>${c[0]}</b><span>${c[1]}</span></div>`).join("");
$("#pf").style.width=pc+"%";$("#pt").textContent=App.t("prog_text",L,P.length);const l=items();
$("#list").innerHTML=l.map(p=>App.card(p)).join("")||`<p class="muted">${App.t(tab==="fav"?"empty_fav":"empty_learned")}</p>`}
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;tab=b.dataset.t;document.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("on",x===b));render()};
$("#exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(items().map(({id,_a,_e,_all,...p})=>p),null,2)],{type:"application/json"}));a.download="my-phrases.json";a.click()};
$("#rst").onclick=()=>{if(confirm(App.t("reset_confirm"))){st.set("learned-phrases",[]);st.set("quiz-best",0);location.reload()}};
document.addEventListener("app:change",render);render();
</script>
</body>
</html>
